<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111216">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>VTM V6 Alpha Character Generator</title>
<style>
:root{color-scheme:dark;--bg:#0d0e11;--panel:#15171c;--panel2:#1b1e24;--panel3:#111319;--line:#2b3038;--line2:#4a515d;--text:#f3f4f6;--muted:#9da6b2;--accent:#ddd6c8;--good:#b7d6b6;--warn:#e1c97d;--danger:#e2a0a0;--info:#aac9de;--shadow:0 12px 40px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.desktopShell{max-width:1560px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr) 390px;gap:14px;padding:14px}.leftNav,.infoPanel{position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow:auto}.leftNav,.infoPanel,.mainCard{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.leftNav{padding:14px}.brand{font-size:17px;font-weight:850;line-height:1.15}.brand small{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:600}.rawBadge{display:inline-flex;margin-top:10px;border:1px solid var(--line2);border-radius:999px;padding:5px 8px;font-size:10px;color:var(--info)}.navSteps{display:grid;gap:5px;margin-top:16px}.navStep{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:11px;padding:9px 10px;font-weight:700;font-size:12px}.navStep.active{background:var(--accent);color:#111216}.navStep.done:after{content:" ✓";color:var(--good)}.navStep.blocked{color:var(--danger)}.navActions{display:grid;gap:7px;margin-top:16px}.btn{min-height:42px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:8px 11px;font-weight:750}.btn.primary{background:var(--accent);color:#111216;border-color:var(--accent)}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.35}.main{min-width:0}.mobileTop{display:none}.mainCard{padding:18px}.step{display:none}.step.active{display:block}.step h1{margin:0 0 5px;font-size:26px}.lead{color:var(--muted);line-height:1.5;font-size:13px;margin-bottom:15px}.sectionTitle{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 9px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.gridAuto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px}.choiceCard{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:13px;min-height:120px}.choiceCard.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.choiceCard.incomplete{border-color:#5d4b32}.choiceCard h3{margin:0 0 5px;font-size:16px}.meta{font-size:11px;color:var(--muted);line-height:1.4}.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:10px;color:var(--info)}.tag.warn{color:var(--warn)}.tag.good{color:var(--good)}.notice{border:1px solid var(--line);border-radius:12px;padding:10px 11px;font-size:12px;line-height:1.45;margin:9px 0;color:var(--muted)}.notice.warn{color:var(--warn);border-color:#4b432b}.notice.danger{color:var(--danger);border-color:#56383a}.notice.good{color:var(--good);border-color:#38503c}.field{margin:8px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;min-height:43px;border:1px solid var(--line);background:var(--panel3);color:var(--text);border-radius:10px;padding:8px 10px}.field textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.rowname{font-weight:750;font-size:13px}.rowmeta{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.35}.stepper{display:grid;grid-template-columns:36px 34px 36px;gap:4px;align-items:center}.stepper button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel3);color:var(--text);font-size:18px;font-weight:850}.stepper .n{text-align:center;font-weight:850}.budgetBar{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.pill{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 8px;font-size:11px}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.danger{color:var(--danger)}.attrCols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.attrCol{border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:11px}.attrColHead{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}.attrColHead b{font-size:15px}.roleSelect{min-height:34px;border:1px solid var(--line);background:var(--panel3);color:var(--text);border-radius:9px;padding:5px}.dots{display:flex;gap:5px;flex-wrap:wrap}.dotBtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:var(--panel3);color:transparent}.dotBtn.on{background:var(--accent);border-color:var(--accent)}.dotBtn:hover{border-color:var(--accent)}.infoBtn{min-height:32px;border:1px solid var(--line);background:transparent;color:var(--info);border-radius:9px;padding:5px 8px;font-size:11px}.lpCard{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;margin:9px 0}.lpHead{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:9px;align-items:start}.lpSkillGrid,.lpResGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}.focusInputs{display:grid;gap:6px;margin-top:6px}.focusLine{display:grid;grid-template-columns:1fr 1fr;gap:7px}.powerCard,.traitCard,.meritCard,.natureCard{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:11px}.selectable{cursor:pointer}.selectable.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.selectable.disabled{opacity:.45;cursor:not-allowed}.powerMeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.checkline{display:flex;gap:8px;align-items:flex-start}.checkline input{width:20px;height:20px;flex:0 0 auto}.inlineSplit{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:end}.resourceEntry{display:grid;grid-template-columns:150px 1fr 90px auto;gap:7px;align-items:end;margin:7px 0}.derived{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.derived .card b{font-size:28px}.reviewGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}.kv:last-child{border-bottom:0}.issues{display:grid;gap:6px}.issue{border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:11px}.issue.error{color:var(--danger)}.issue.incomplete{color:var(--warn)}.bottomNav{display:flex;justify-content:space-between;gap:8px;margin-top:18px;padding-top:13px;border-top:1px solid var(--line)}.infoPanel{padding:15px}.infoKicker{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--info)}.infoPanel h2{font-size:23px;margin:6px 0 6px}.infoSummary{color:#dadddf;line-height:1.5;font-size:13px}.infoMeta{display:grid;gap:6px;margin:12px 0}.infoMeta .kv{font-size:11px}.infoBody{font-size:12px;line-height:1.55;color:#d6d9df}.infoBody p{margin:9px 0}.ratingList{display:grid;gap:7px;margin-top:10px}.ratingItem{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px}.ratingItem.active{border-color:var(--accent)}.ratingDots{font-weight:900;letter-spacing:1px}.infoSource{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.mobileInfoBtn{display:none}.drawerBack{display:none}.drawerClose{display:none}.hidden{display:none!important}
@media(max-width:1180px){.desktopShell{grid-template-columns:205px minmax(0,1fr) 330px}.mainCard{padding:15px}.attrCols{grid-template-columns:1fr}.lpSkillGrid,.lpResGrid{grid-template-columns:1fr}}
@media(max-width:900px){.desktopShell{display:block;padding:0 10px calc(84px + env(safe-area-inset-bottom))}.leftNav{display:none}.mobileTop{display:block;position:sticky;top:0;z-index:30;background:rgba(13,14,17,.96);backdrop-filter:blur(14px);margin:0 -10px 10px;padding:calc(9px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line)}.mobileHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.mobileTitle{font-weight:850;font-size:15px}.mobileProgress{display:flex;gap:5px;overflow:auto;margin-top:8px;scrollbar-width:none}.mobileProgress::-webkit-scrollbar{display:none}.mobileStep{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;min-height:33px;padding:6px 9px;font-size:10px;font-weight:750}.mobileStep.active{background:var(--accent);color:#111216}.mainCard{border-radius:15px;padding:13px}.step h1{font-size:23px}.grid2,.grid3,.reviewGrid{grid-template-columns:1fr}.attrCols{grid-template-columns:1fr}.lpHead{grid-template-columns:1fr}.lpSkillGrid,.lpResGrid{grid-template-columns:1fr}.resourceEntry{grid-template-columns:1fr 1fr}.resourceEntry .btn{grid-column:1/-1}.infoPanel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:80;max-height:82vh;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .2s ease;box-shadow:0 -15px 50px rgba(0,0,0,.45);padding:17px 15px calc(20px + env(safe-area-inset-bottom))}.infoPanel.open{transform:translateY(0)}.drawerBack{display:block;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s}.drawerBack.open{opacity:1;pointer-events:auto}.drawerClose{display:block;position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px}.mobileInfoBtn{display:inline-flex;min-height:34px}.bottomNav{position:fixed;z-index:40;left:0;right:0;bottom:0;margin:0;background:rgba(13,14,17,.97);backdrop-filter:blur(14px);padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.bottomNav .btn{flex:1}.derived{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="drawerBack" id="drawerBack"></div>
<div class="desktopShell">
  <aside class="leftNav">
    <div class="brand">VTM V6 Alpha<br>Character Generator<small>Player Packet RAW · adaptive PWA</small></div>
    <div class="rawBadge">No V5 / hybrid house rules</div>
    <div class="navSteps" id="navSteps"></div>
    <div class="navActions">
      <button class="btn" id="exportBtn">Export JSON</button>
      <label class="btn" style="text-align:center;cursor:pointer">Import JSON<input id="importFile" type="file" accept="application/json" hidden></label>
      <button class="btn danger" id="resetBtn">Reset character</button>
    </div>
  </aside>
  <main class="main">
    <div class="mobileTop">
      <div class="mobileHead"><div class="mobileTitle">VTM V6 Alpha Chargen</div><button class="btn mobileInfoBtn" id="mobileInfoTop">Info</button></div>
      <div class="mobileProgress" id="mobileProgress"></div>
    </div>
    <div class="mainCard" id="mainCard"></div>
  </main>
  <aside class="infoPanel" id="infoPanel"><button class="drawerClose" id="drawerClose">×</button><div id="infoContent"></div></aside>
</div>
<script src="./data/v6.js"></script>
<script src="./src/app.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script>
</body>
</html>
