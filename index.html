<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#111216" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>VTM V6 Alpha</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0e11;
        --panel: #15171c;
        --panel2: #1b1e24;
        --panel3: #111319;
        --line: #2b3038;
        --line2: #4a515d;
        --text: #f3f4f6;
        --muted: #9da6b2;
        --accent: #ddd6c8;
        --good: #b7d6b6;
        --warn: #e1c97d;
        --danger: #e2a0a0;
        --info: #aac9de;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        touch-action: manipulation;
      }
      .desktopShell {
        max-width: 1560px;
        margin: auto;
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr) 390px;
        gap: 14px;
        padding: 14px;
      }
      .leftNav,
      .infoPanel {
        position: sticky;
        top: 14px;
        align-self: start;
        max-height: calc(100vh - 28px);
        overflow: auto;
      }
      .leftNav,
      .infoPanel,
      .mainCard {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }
      .leftNav {
        padding: 14px;
      }
      .brand {
        font-size: 17px;
        font-weight: 850;
        line-height: 1.15;
      }
      .brandTitle {
        display: block;
        margin-top: 2px;
        font-size: 14px;
        line-height: 1.15;
        white-space: nowrap;
      }
      .navSteps {
        display: grid;
        gap: 5px;
        margin-top: 16px;
      }
      .navStep {
        width: 100%;
        text-align: left;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        border-radius: 11px;
        padding: 8px 9px;
        font-weight: 700;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .navStepLabel {
        display: block;
        min-width: 0;
      }
      .navCount {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        min-width: 38px;
        min-height: 24px;
        border-radius: 8px;
        padding: 3px 6px;
        font-size: 10px;
        line-height: 1;
        font-weight: 900;
        color: #111216;
      }
      .navCount.good {
        background: var(--good);
      }
      .navCount.warn {
        background: var(--warn);
      }
      .navCount.danger {
        background: var(--danger);
      }
      .navStep.active {
        background: var(--accent);
        color: #111216;
      }
      .navStep.blocked {
        color: var(--danger);
      }
      .navActions {
        display: grid;
        gap: 7px;
        margin-top: 16px;
      }
      .versionLabel {
        margin-top: 1px;
        text-align: center;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
      }
      .navActionEdge,
      .navActionPair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .langBtn {
        font-weight: 900;
        letter-spacing: 0.06em;
      }
      .btn {
        min-height: 42px;
        border: 1px solid var(--line);
        background: var(--panel2);
        color: var(--text);
        border-radius: 11px;
        padding: 8px 11px;
        font-weight: 750;
      }
      .btn.primary {
        background: var(--accent);
        color: #111216;
        border-color: var(--accent);
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.danger {
        color: var(--danger);
      }
      .btn:disabled {
        opacity: 0.35;
      }
      .main {
        min-width: 0;
      }
      .mobileTop {
        display: none;
      }
      .mainCard {
        padding: 18px;
      }
      .step {
        display: none;
      }
      .step.active {
        display: block;
      }
      .step h1 {
        margin: 0 0 5px;
        font-size: 26px;
      }
      .lead {
        color: var(--muted);
        line-height: 1.5;
        font-size: 13px;
        margin-bottom: 15px;
      }
      .sectionTitle {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 20px 0 9px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        align-items: start;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        align-items: start;
      }
      .gridAuto {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
        align-items: start;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 14px;
        padding: 12px;
      }
      .choiceCard {
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--panel2);
        color: var(--text);
        border-radius: 14px;
        padding: 13px;
        min-height: 0;
        align-self: start;
      }
      .choiceCard.selected {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .choiceCard.incomplete {
        border-color: #5d4b32;
      }
      .choiceCard h3 {
        margin: 0 0 5px;
        font-size: 16px;
      }

      .creatureGrid {
        align-items: stretch;
        grid-auto-rows: 1fr;
      }
      .creatureChoiceCard {
        align-self: stretch;
        height: 100%;
        padding: 0 44px 0 0;
        overflow: hidden;
      }
      .creatureChoiceMain {
        width: 100%;
        height: 100%;
        min-height: 100%;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 13px;
        cursor: pointer;
      }
      .creatureChoiceMain:hover,
      .creatureChoiceMain:focus-visible {
        background: rgba(255, 255, 255, 0.025);
        outline: none;
      }
      .youngChoiceCard {
        padding: 0 44px 0 0;
      }
      .youngChoiceMain {
        min-height: 70px;
        padding: 12px;
        cursor: pointer;
      }
      .optionList {
        display: grid;
        gap: 8px;
      }
      .choiceRow {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(170px, auto);
        gap: 12px;
        align-items: start;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--panel2);
        color: var(--text);
        border-radius: 13px;
        padding: 11px 12px;
      }
      .choiceRow.selected,
      .choiceCompact.selected,
      .choiceChip.selected {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .choiceRow.incomplete {
        border-color: #5d4b32;
      }
      .choiceRowMain {
        min-width: 0;
      }
      .choiceRowTitle {
        font-size: 14px;
        font-weight: 800;
      }
      .choiceRowMeta {
        font-size: 11px;
        line-height: 1.45;
        color: var(--muted);
        margin-top: 4px;
      }
      .choiceRowAside {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: 330px;
      }
      .choiceRow.clanRow {
        grid-template-columns: minmax(0, 66fr) minmax(0, 34fr);
        gap: 8px;
        padding: 0;
        align-items: stretch;
        overflow: hidden;
      }
      .clanChoiceMain {
        width: 100%;
        min-width: 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 11px 12px;
      }
      button.clanChoiceMain {
        cursor: pointer;
      }
      button.clanChoiceMain:hover,
      button.clanChoiceMain:focus-visible {
        background: rgba(255, 255, 255, 0.025);
        outline: none;
      }
      .clanRowAside {
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 7px;
        padding: 7px 9px 7px 0;
      }
      .clanDisciplineList {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.018);
        overflow: hidden;
      }
      .clanDisciplineLine {
        min-width: 0;
        padding: 4px 7px;
        font-size: 11px;
        line-height: 1.25;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .clanDisciplineLine + .clanDisciplineLine {
        border-top: 1px solid var(--line);
      }
      .clanDisciplineLine.variable {
        color: var(--accent);
      }
      .disciplineOr {
        display: inline-block;
        margin: 0 5px;
        color: var(--muted);
        font-weight: 600;
      }
      .choiceRow.clanRow.selected {
        border-color: var(--good);
        box-shadow: inset 0 0 0 1px var(--good);
      }
      .choiceRow.clanRow.unavailable {
        opacity: 0.68;
      }
      .clanChoiceDisabled {
        cursor: default;
      }
      .clanUnavailableTitle {
        margin-top: 24px;
      }
      .clanUnavailableLead {
        margin: -3px 0 9px;
        max-width: 760px;
      }
      .requiredChoice {
        border: 1px solid #4b432b;
        background: rgba(225, 201, 125, 0.04);
        border-radius: 14px;
        padding: 11px;
        margin: 10px 0;
      }

      .variableDisciplineChoice {
        position: relative;
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 12px;
        padding: 0 44px 0 0;
        overflow: hidden;
      }
      .variableDisciplineChoice.selected {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .variableDisciplineMain {
        width: 100%;
        height: 100%;
        display: grid;
        gap: 4px;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 11px;
        cursor: pointer;
      }
      .variableDisciplineMain:hover,
      .variableDisciplineMain:focus-visible {
        background: rgba(255, 255, 255, 0.025);
        outline: none;
      }
      .variableDisciplineMain b {
        font-size: 14px;
      }
      .variableDisciplineMain span {
        font-size: 10px;
        line-height: 1.4;
        color: var(--muted);
      }
      .choiceCompact {
        width: 100%;
        display: grid;
        gap: 4px;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--panel2);
        color: var(--text);
        border-radius: 12px;
        padding: 11px;
      }
      .choiceCompact b {
        font-size: 14px;
      }
      .choiceCompact span {
        font-size: 10px;
        line-height: 1.4;
        color: var(--muted);
      }
      .choiceChipGrid {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .choiceChip {
        display: grid;
        gap: 2px;
        min-width: 88px;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--panel2);
        color: var(--text);
        border-radius: 11px;
        padding: 9px 11px;
      }
      .choiceChip span {
        font-size: 10px;
        color: var(--muted);
      }
      .skillRow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 13px;
        padding: 10px 11px;
      }
      .skillRowMain {
        min-width: 0;
      }
      .focusCard {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 13px;
        padding: 11px;
      }
      .focusHead {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .meta {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.4;
      }
      .tagrow {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .tag {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 7px;
        font-size: 10px;
        color: var(--info);
      }
      .tag.warn {
        color: var(--warn);
      }
      .tag.good {
        color: var(--good);
      }
      .notice {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 11px;
        font-size: 12px;
        line-height: 1.45;
        margin: 9px 0;
        color: var(--muted);
      }
      .notice.warn {
        color: var(--warn);
        border-color: #4b432b;
      }
      .notice.danger {
        color: var(--danger);
        border-color: #56383a;
      }
      .notice.good {
        color: var(--good);
        border-color: #38503c;
      }
      .field {
        margin: 8px 0;
      }
      .field label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 5px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        min-height: 43px;
        border: 1px solid var(--line);
        background: var(--panel3);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .field textarea {
        min-height: 100px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 9px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .rowname {
        font-weight: 750;
        font-size: 13px;
      }
      .rowmeta {
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
        line-height: 1.35;
      }
      .stepper {
        display: grid;
        grid-template-columns: 36px 34px 36px;
        gap: 4px;
        align-items: center;
      }
      .stepper button {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--panel3);
        color: var(--text);
        font-size: 18px;
        font-weight: 850;
      }
      .stepper .n {
        text-align: center;
        font-weight: 850;
      }
      .budgetBar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 9px 0;
      }
      .pill {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 999px;
        padding: 6px 8px;
        font-size: 11px;
      }
      .pill.good {
        color: var(--good);
      }
      .pill.warn {
        color: var(--warn);
      }
      .pill.danger {
        color: var(--danger);
      }
      .attrCols {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        align-items: start;
      }
      .attrCol {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel2);
        overflow: hidden;
      }
      .attrColHead {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.012);
      }
      .attrColHead b {
        font-size: 15px;
      }
      .roleSelect {
        min-height: 34px;
        border: 1px solid var(--line);
        background: var(--panel3);
        color: var(--text);
        border-radius: 9px;
        padding: 5px;
      }
      .attrItem {
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .attrItem:last-child {
        border-bottom: 0;
      }
      .attrItemTop {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 9px;
      }
      .attrNameBtn {
        border: 0;
        background: transparent;
        color: var(--text);
        padding: 0;
        font-weight: 800;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .attrNameBtn:hover {
        color: var(--info);
      }
      .attrCurrent {
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      .attrRatings {
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
      }
      .ratingBtn {
        width: 31px;
        height: 31px;
        flex: 0 0 31px;
        border-radius: 9px;
        border: 1px solid var(--line2);
        background: var(--panel3);
        color: var(--muted);
        padding: 0;
        font-size: 12px;
        font-weight: 850;
      }
      .ratingBtn.selected {
        background: var(--accent);
        border-color: var(--accent);
        color: #111216;
      }
      .ratingBtn:not(:disabled):hover,
      .ratingBtn:not(:disabled):focus-visible {
        border-color: var(--accent);
        color: var(--text);
        outline: none;
        box-shadow: 0 0 0 2px rgba(221, 214, 200, 0.12);
      }
      .ratingBtn:disabled {
        opacity: 0.25;
        cursor: not-allowed;
      }
      .attrHelp {
        margin-left: auto;
        min-height: 27px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--info);
        border-radius: 8px;
        padding: 4px 7px;
        font-size: 10px;
      }
      .infoBtn {
        min-height: 32px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--info);
        border-radius: 9px;
        padding: 5px 8px;
        font-size: 11px;
      }
      .lpCard {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 14px;
        padding: 12px;
        margin: 9px 0;
      }
      .lpHead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 190px;
        gap: 9px;
        align-items: start;
      }
      .lpSkillGrid,
      .lpResGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 12px;
      }
      .focusInputs {
        display: grid;
        gap: 6px;
        margin-top: 6px;
      }
      .focusLine {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .powerCard,
      .traitCard,
      .meritCard,
      .natureCard {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 13px;
        padding: 11px;
      }
      .powerGroup {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        margin-top: 12px;
      }
      .powerGroup:first-of-type {
        border-top: 0;
      }
      .powerGroupHead {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin-bottom: 8px;
      }
      .powerGroupHead b {
        font-size: 16px;
      }
      .selectable {
        cursor: pointer;
      }
      .selectable.selected {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .selectable.disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .powerMeta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .checkline {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .checkline input {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
      }
      .inlineSplit {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 7px;
        align-items: end;
      }
      .resourceEntry {
        display: grid;
        grid-template-columns: 150px 1fr 90px auto;
        gap: 7px;
        align-items: end;
        margin: 7px 0;
      }
      .derived {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }
      .derived .card b {
        font-size: 28px;
      }
      .reviewGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .kv {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .kv:last-child {
        border-bottom: 0;
      }
      .issues {
        display: grid;
        gap: 6px;
      }
      .issue {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 9px;
        font-size: 11px;
      }
      .issue.error {
        color: var(--danger);
      }
      .issue.incomplete {
        color: var(--warn);
      }
      .bottomNav {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 18px;
        padding-top: 13px;
        border-top: 1px solid var(--line);
      }
      .infoPanel {
        padding: 15px;
      }
      .infoKicker {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--info);
      }

      .sheetResourceHead b {

      .sheetResourceDetail {

      @media (max-width: 1280px) {

        .sheetSkillGrid,

      .equalTiles {
        align-items: stretch !important;
      }
      .equalTiles > * {
        height: 100%;
      }
      .caitiffChoice {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 13px;
        padding: 12px;
        color: var(--text);
        cursor: pointer;
      }
      .caitiffChoice.selected {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .caitiffChoice input {
        width: 18px;
        height: 18px;
        margin: 2px 0 0;
        justify-self: center;
      }
      .powerMeta .tag,
      .tag {
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .sheetInfoBtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        min-width: 22px;
        padding: 0;
        border: 1px solid var(--line2);
        border-radius: 50%;
        background: transparent;
        color: var(--info);
        font-size: 11px;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
        vertical-align: middle;
      }
      .sheetInfoBtn:hover,
      .sheetInfoBtn:focus-visible {
        border-color: var(--accent);
        color: var(--text);
        outline: none;
      }
      .sheetKVValue,
      .sheetAttrActions,
      .sheetResourceActions,
      .sheetDiscTitleRight,
      .sheetPowerActions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        min-width: 0;
      }
      .sheetKV.wide {
        grid-column: span 2;
        grid-template-columns: 90px minmax(0, 1fr);
      }
      .sheetKV.wide .sheetKVValue {
        justify-content: flex-start;
        text-align: left;
      }
      .sheetKV.wide b {
        text-align: left;
      }
      .sheetKVValue b {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .sheetSkillRow {
        grid-template-columns: minmax(105px, auto) 92px minmax(0, 1fr) 24px;
      }
      .sheetPowerActions {
        white-space: nowrap;
      }
      .sheetRuleCard {
        min-height: 74px;
      }
      .sheetBlock h3 .sheetInfoBtn {
        margin-left: 5px;
      }
      .mobileActions {
        display: none;
      }
      @media (max-width: 900px) {
        .mobileActions {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 6px;
          margin-top: 7px;
        }
        .mobileActions .btn {
          min-height: 34px;
          padding: 6px 8px;
          font-size: 11px;
          text-align: center;
        }
        .mobileImportLabel {
          display: flex;

          cursor: pointer;
        }
        .sheetKV.wide {
          grid-column: span 1;
        }
        .sheetSkillRow {
          grid-template-columns: minmax(90px, auto) 82px minmax(0, 1fr) 24px;
        }
      }
